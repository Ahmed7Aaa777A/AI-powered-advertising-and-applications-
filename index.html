<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="موقعي الجديد - صفحة الترحيب">
    <title>عنوان الموقع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            padding: 50px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #777;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="emoji">🎉</span>
        <h1>مرحباً بك في موقعك الجديد!</h1>
        <p>دي الصفحة الرئيسية لموقعك. من هنا نقدر نبني أي حاجة تخطر على بالك ✨</p>
    </div>
</body>
</html>
